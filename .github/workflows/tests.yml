name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare parser runtime
        run: python token-graph/scripts/setup_runtime.py --download-deps --no-agent
      - name: Check generated viewer
        run: python viewer-src/build.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
